<style>
:root{--bg:#F5F7F7;--panel:#FFFFFF;--ink:#18252B;--muted:#5E6E75;--rule:#DCE3E5;--accent:#1F5F66;--crit:#B23A30}
@media (prefers-color-scheme:dark){:root{--bg:#0F1719;--panel:#162124;--ink:#E3ECEE;--muted:#93A4AA;--rule:#28363A;--accent:#6FB3B8;--crit:#E8766A;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;display:grid;place-items:center;padding:16px}
form{width:min(100%,380px);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:28px 26px;display:grid;gap:14px}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:600 1.35rem/1.25 "IBM Plex Serif",Georgia,serif;margin:0}
p{margin:0;color:var(--muted);font-size:.88rem}
label{font-size:.82rem;font-weight:500}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
button{font:600 .95rem "IBM Plex Sans",sans-serif;padding:10px;border:0;border-radius:6px;background:var(--accent);color:var(--panel);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--crit);font-size:.85rem;min-height:1.2em}

<script>
const B = JSON.parse(document.getElementById('blob').textContent), b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', salt: b64(B.s), iterations: B.n, hash: 'SHA-256'}, base, 256));
}
async function openWith(raw) {
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(B.i)}, k, b64(B.c)));
  document.open(); document.write(html); document.close();
}
// "remember" keeps the passphrase (not a per-build key, since the salt changes every update) in this browser only
(async () => { let pw = null; try { pw = localStorage.getItem('bharat_dash_pw'); } catch (e) {}
  if (pw) { try { await openWith(await keyFrom(pw)); return; } catch (e) { try { localStorage.removeItem('bharat_dash_pw'); } catch (_) {} } } })();
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault(); const go = document.getElementById('go'), err = document.getElementById('err'), pw = document.getElementById('pw').value;
  go.disabled = true; go.textContent = 'Opening…'; err.textContent = '';
  try { await openWith(await keyFrom(pw)); if (document.getElementById('rem') && document.getElementById('rem').checked) { try { localStorage.setItem('bharat_dash_pw', pw); } catch (_) {} } }
  catch (x) { err.textContent = 'That passphrase did not open the dashboard. Check it and try again.'; go.disabled = false; go.textContent = 'Open dashboard'; }
});
</script></body></html>
